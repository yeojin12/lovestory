<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">여우사이 로비플레이 부스 배치도</title>
  <desc id="desc">1번 포토 부스존부터 11번 뮤지컬 소개까지 번호가 표시된 배치도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f8eef1"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8e2e8"/><stop offset="1" stop-color="#efd0da"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbee"/><stop offset="1" stop-color="#f5ead3"/></linearGradient>
    <style>
      .wall{fill:#e8e7e7}.box{stroke:#59303c;stroke-width:2}.pink{fill:url(#pink)}.cream{fill:url(#cream)}
      .label{font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:24px;font-weight:600;fill:#4f2b36;text-anchor:middle}
      .place{font-family:Pretendard,'Noto Sans KR',sans-serif;font-size:24px;font-weight:600;fill:#272326;text-anchor:middle}
      .num{fill:#d95670}.numText{font-family:Pretendard,sans-serif;font-size:22px;font-weight:800;fill:white;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>
  <rect width="1400" height="900" rx="38" fill="url(#bg)"/>
  <rect class="box" x="70" y="55" width="165" height="58" fill="white"/><text class="place" x="152" y="92">계단</text>
  <rect class="box" x="370" y="55" width="300" height="58" fill="white"/><text class="place" x="520" y="92">에스컬레이터</text>
  <rect class="box" x="760" y="55" width="170" height="58" fill="white"/><text class="place" x="845" y="92">게시판</text>
  <rect class="box" x="70" y="130" width="45" height="175" fill="white"/><text class="place" x="92" y="175"><tspan x="92">엘</tspan><tspan x="92" dy="27">리</tspan><tspan x="92" dy="27">베</tspan><tspan x="92" dy="27">이</tspan><tspan x="92" dy="27">터</tspan></text>
  <path class="wall" d="M70 320H930V850H900V365H70Z"/>
  <rect class="box" x="410" y="318" width="130" height="48" fill="white"/><text class="place" x="475" y="350">출입문</text>
  <rect class="wall" x="1160" y="55" width="195" height="575"/><rect class="box" x="1315" y="520" width="42" height="120" fill="white"/><text class="place" x="1336" y="555"><tspan x="1336">화</tspan><tspan x="1336" dy="27">장</tspan><tspan x="1336" dy="27">실</tspan></text>

  <!-- photo area -->
  <g><rect class="box cream" x="960" y="315" width="170" height="92"/><circle class="num" cx="984" cy="339" r="20"/><text class="numText" x="984" y="339">1</text><text class="label" x="1045" y="362">포토 부스존</text></g>
  <g><rect class="box cream" x="960" y="445" width="170" height="120"/><circle class="num" cx="984" cy="469" r="20"/><text class="numText" x="984" y="469">2</text><text class="label" x="1045" y="500"><tspan x="1045">전신거울</tspan><tspan x="1045" dy="31">포토존</tspan></text></g>
  <g><rect class="box cream" x="960" y="630" width="170" height="120"/><circle class="num" cx="984" cy="654" r="20"/><text class="numText" x="984" y="654">3</text><text class="label" x="1045" y="686"><tspan x="1045">영수증</tspan><tspan x="1045" dy="31">사진기</tspan></text></g>

  <!-- lobby booths -->
  <g><rect class="box pink" x="220" y="565" width="165" height="125"/><circle class="num" cx="244" cy="589" r="20"/><text class="numText" x="244" y="589">4</text><text class="label" x="302" y="627"><tspan x="302">스크래치</tspan><tspan x="302" dy="31">카드</tspan></text></g>
  <g><rect class="box pink" x="220" y="185" width="165" height="78"/><circle class="num" cx="244" cy="209" r="20"/><text class="numText" x="244" y="209">5</text><text class="label" x="302" y="232">방명록</text></g>
  <g><rect class="box pink" x="655" y="730" width="165" height="120"/><circle class="num" cx="679" cy="754" r="20"/><text class="numText" x="679" y="754">6</text><text class="label" x="737" y="800">마음의 약국</text></g>
  <g><rect class="box pink" x="655" y="380" width="165" height="130"/><circle class="num" cx="679" cy="404" r="20"/><text class="numText" x="679" y="404">7</text><text class="label" x="737" y="442"><tspan x="737">슈링클스</tspan><tspan x="737" dy="31">만들기</tspan></text></g>
  <g><rect class="box pink" x="220" y="730" width="165" height="120"/><circle class="num" cx="244" cy="754" r="20"/><text class="numText" x="244" y="754">8</text><text class="label" x="302" y="800">놀이 부스</text></g>
  <g><rect class="box pink" x="425" y="585" width="180" height="82"/><circle class="num" cx="449" cy="609" r="20"/><text class="numText" x="449" y="609">9</text><text class="label" x="515" y="636">스탬프 부스</text></g>
  <g><rect class="box pink" x="220" y="380" width="165" height="130"/><circle class="num" cx="244" cy="404" r="20"/><text class="numText" x="244" y="404">10</text><text class="label" x="302" y="442"><tspan x="302">대왕종이판</tspan><tspan x="302" dy="31">뽑기</tspan></text></g>
  <g><rect class="box pink" x="655" y="565" width="165" height="125"/><circle class="num" cx="679" cy="589" r="20"/><text class="numText" x="679" y="589">11</text><text class="label" x="737" y="625"><tspan x="737">여우사이</tspan><tspan x="737" dy="31">뮤지컬 소개</tspan></text></g>
</svg>
